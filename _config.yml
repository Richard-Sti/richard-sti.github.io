# Site settings
title: "Dr Richard Stiskalek"
description: 'Hintze Prize Fellow in Astrophysics (Cosmology) at the University of Oxford'
url: 'https://richard-sti.github.io'
baseurl: ''

# Token from Google Search Console -> HTML tag verification method.
# If left empty, the meta tag is not rendered.
google_site_verification: ''

navigation:
  - title: About
    url: /
  - title: Research
    url: /research
  - title: Updates
    url: /updates
  - title: Blog
    url: /blog
  - title: CV
    url: /images/CV.pdf

author:
  name: 'Richard Stiskalek'
  email: richard.stiskalek@physics.ox.ac.uk
  github_username: Richard-Sti
  linkedin_username: richard-stiskalek
  orcid: 0000-0002-0986-314X
  ads_url: https://ui.adsabs.harvard.edu/public-libraries/a6A7dKJOSwmV4heJ0LQ-0w

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

# Build settings
destination: _site
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  input: GFM
  hard_wrap: false

exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png', 'CLAUDE.md', 'LICENSE-academic.txt', 'scripts']
